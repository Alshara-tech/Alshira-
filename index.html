    var b64Url = token.split('.')[1];

    var json = decodeURIComponent(atob(b64).split('').map(function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)}).join(''));

  }catch(e){ return {}; }
}

      // Find the beige bottom bar - look for elements containing المدونة and الرئيسية
      const all = document.body.innerHTML;
      // Direct fix: replace any empty pill or blurred element with قصتنا
      document.querySelectorAll('button, span, div').forEach(el=>{
        const rect = el.getBoundingClientRect();
        // If element is the small blurred pill near bottom (width ~ 80, height ~ 25, bottom area)
        if(rect.bottom > window.innerHeight - 100 && rect.width > 50 && rect.width < 150 && rect.height < 35 && el.textContent.trim().length < 2){

      footers.forEach(f=>{

          }

          f.querySelectorAll('*').forEach(ch=>{
            if(ch.textContent.trim()==='' && ch.offsetWidth>30 && ch.offsetHeight>10 && ch.offsetHeight<40){
