<style>
/* إخفاء آمن لقسم المراجعات والـ Nickname فقط */
div.bg-\[\#FFF8E1\] {display:none !important;}
section.mt-14.rounded-\[24px\].bg-\[\#FFF8E1\] {display:none !important;}
#cusdis_thread {display:none !important;}
div:has(> div.bg-white.rounded-2xl) {display:none !important;}
</style>

<script>
(function(){
  function hideReviewsAndNickname(){
    // 1. إخفاء كروت المراجعات
    document.querySelectorAll('div').forEach(el=>{
      const txt = el.textContent || '';
      if(txt.includes('محمد باوزير') || txt.includes('البرونزي كان خيار ممتاز') || txt.includes('مكتب محترف، التزام بالوقت')){
        // اطلع لفوق حتى تلاقي الكارت
        let parent = el;
        for(let i=0;i<6;i++){
          if(!parent) break;
          if(parent.className && typeof parent.className === 'string' && parent.className.includes('bg-white') && parent.className.includes('rounded-2xl')){
            parent.style.display = 'none';
            break;
          }
          if(parent.className && typeof parent.className === 'string' && parent.className.includes('bg-[#FFF8E1]')){
            parent.style.display = 'none';
            break;
          }
          parent = parent.parentElement;
        }
      }
      
      // 2. إخفاء قسم ماذا قال عملاؤنا كامل
      if(txt.includes('البرونزي كان خيار ممتاز، دعم سريع')){
        let parent = el;
        for(let i=0;i<8;i++){
          if(!parent) break;
          if(parent.className && typeof parent.className === 'string' && (parent.className.includes('bg-[#FFF8E1]') || parent.className.includes('rounded-[24px]'))){
            parent.style.display = 'none';
            break;
          }
          parent = parent.parentElement;
        }
      }
    });
    
    // إخفاء كل div بخلفية بيج فاتح
    document.querySelectorAll('div.bg-\[\#FFF8E1\], section.bg-\[\#FFF8E1\]').forEach(el=>{
      el.style.display = 'none';
    });
    
    // 3. إخفاء Nickname و Email
    document.querySelectorAll('div, label, span').forEach(el=>{
      const t = (el.textContent||'').trim();
      if(t === 'Nickname' || t === 'Email (optional)'){
        // إخفاء الحقل كامل
        let container = el.parentElement;
        if(container){
          // إخفاء الـ input اللي تحته
          const nextInput = container.querySelector('input');
          if(nextInput) nextInput.style.display = 'none';
          // إخفاء الـ label نفسه
          el.style.display = 'none';
          // إذا كان فيه div أب يحتوي الاثنين
          let grand = container.parentElement;
          if(grand && grand.textContent.includes('Nickname') && grand.textContent.includes('Email')){
            // لا نحذف الكل، بس نخفي الحقول
            grand.querySelectorAll('input').forEach(inp=>inp.style.display='none');
            grand.querySelectorAll('div').forEach(d=>{
              if(d.textContent.trim() === 'Nickname' || d.textContent.trim() === 'Email (optional)'){
                d.style.display = 'none';
              }
            });
          }
        }
      }
    });
    
    // إخفاء inputs الخاصة بـ Nickname و Email مباشرة
    document.querySelectorAll('input').forEach(inp=>{
      const ph = inp.placeholder || '';
      const parentText = (inp.parentElement?.textContent || '') + (inp.parentElement?.parentElement?.textContent || '');
      if(ph.toLowerCase().includes('nickname') || parentText.includes('Nickname') || parentText.includes('Email (optional)')){
        inp.style.display = 'none';
        // إخفاء الـ label فوقه
        let sib = inp.previousElementSibling;
        if(sib) sib.style.display = 'none';
      }
    });
    
    // إخفاء div كبير يحتوي Nickname و Email
    document.querySelectorAll('div').forEach(div=>{
      if(div.textContent.includes('Nickname') && div.textContent.includes('Email (optional)')){
        // تأكد أنه ليس الفوتر
        if(div.children.length < 10 && div.offsetHeight < 200){
          div.style.display = 'none';
        }
      }
    });
  }
  
  hideReviewsAndNickname();
  setTimeout(hideReviewsAndNickname, 300);
  setTimeout(hideReviewsAndNickname, 1000);
  setTimeout(hideReviewsAndNickname, 2000);
  
  const observer = new MutationObserver(hideReviewsAndNickname);
  observer.observe(document.body, {childList:true, subtree:true});
})();
</script>


<style>
/* قتل زر قوقل نهائي - أقوى إخفاء */
button:has(span[style*="EA4335"]), 
button:has(span[style*="linear-gradient"]),
#google-signin-button,
.g_id_signin,
div.g_id_signin,
iframe[src*="accounts.google"],
[id*="g_id"],
[class*="g_id"],
button:has(> span.w-4.h-4.rounded-full.bg-white) {
  display:none !important;
  visibility:hidden !important;
  opacity:0 !important;
  width:0 !important;
  height:0 !important;
  pointer-events:none !important;
}
</style>

<script>
(function(){
  function killGoogleForever(){
    // طريقة 1: بالنص
    document.querySelectorAll('button').forEach(b=>{
      const txt = (b.textContent||'').trim();
      const html = b.innerHTML||'';
      // زر قوقل بالضبط: نصه "دخول" وفيه G ملون
      if(txt === 'دخول' || txt.includes('دخول')){
        if(html.includes('EA4335') || html.includes('FBBC05') || html.includes('34A853') || html.includes('4285F4') || 
           html.includes('linear-gradient') || (html.includes('>G<') && txt.length < 10)){
          b.remove();
        }
      }
      // أي زر فيه G داخل دائرة بيضاء
      if(html.includes('w-4 h-4 rounded-full bg-white') && html.includes('>G<')){
        b.remove();
      }
    });
    
    // طريقة 2: بالـ ID
    const googleBtn = document.getElementById('google-signin-button');
    if(googleBtn) googleBtn.remove();
    
    document.querySelectorAll('[id*="g_id"], [class*="g_id"]').forEach(el=>el.remove());
    document.querySelectorAll('iframe[src*="accounts.google"]').forEach(el=>el.remove());
  }
  
  killGoogleForever();
  setTimeout(killGoogleForever, 100);
  setTimeout(killGoogleForever, 500);
  setTimeout(killGoogleForever, 1000);
  setTimeout(killGoogleForever, 2000);
  
  const obs = new MutationObserver(killGoogleForever);
  obs.observe(document.body, {childList:true, subtree:true, attributes:true});
  
  // اقتله كل ثانية لمدة 10 ثواني
  let count = 0;
  const interval = setInterval(()=>{
    killGoogleForever();
    count++;
    if(count > 10) clearInterval(interval);
  }, 1000);
})();
</script>
